# 百工 CI —— develop 分支：日常开发门禁（文档阶段仓库）。
# 三分支分工：
#   develop → ci.yml：push 到 develop 或 MR 目标为 develop/qa/main 时做结构检查；
#   qa      → qa.yml：push 到 qa 时复跑检查；
#   main    → release.yml：push 到 main 时复跑检查（正式发布随代码落地后启用）。

name: CI 门禁 (develop)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-gate:
    name: 文档结构检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 结构完整性检查
        run: |
          test -f README.md
          echo "文档阶段仓库：暂无代码门禁，仅确认结构完整。"
