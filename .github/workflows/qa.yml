# 百工 QA —— qa 分支：测试验证（文档阶段仓库）。
# 三分支分工：develop 门禁 / qa 复跑检查 / main 发布。测试制品随代码落地后启用。

name: QA 流水线 (qa)

on:
  push:
    branches: [qa]
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-gate:
    name: 文档结构检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 结构完整性检查
        run: |
          test -f README.md
          echo "文档阶段仓库：仅确认结构完整，测试制品随代码落地后启用。"
