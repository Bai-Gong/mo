# 百工·墨 QA —— qa 分支：门禁复跑。
# 三分支分工：develop 门禁 / qa 本文件 / main 正式发布。
# Windows 试用安装包随 M1 真实往返验证启用（参照 jian qa.yml 的 qa-app-windows job）。

name: QA 流水线 (qa)

on:
  push:
    branches: [qa]
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-gate:
    name: 前端门禁 (tsc + vite build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # fang 兄弟仓库检出（原因见 ci.yml 同名步骤注释）。
      # 按轨道定 ref：qa/main 发布轨固定消费 fang@main 稳定版——
      # 用到坊新 API 的代码合并到 qa/main 前，须先把坊对应提交推进到 main。
      - name: 检出 fang（alias 联调的兄弟仓库）
        uses: actions/checkout@v4
        with:
          repository: Bai-Gong/fang
          ref: main
          path: fang
      - name: fang 挪到兄弟目录
        run: mv fang ../fang
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装 fang 依赖
        run: npm ci --prefix ../fang
      - name: 安装依赖并构建
        run: |
          npm ci
          npm run build
      - name: 前端测试
        run: npm run test

  rust-gate:
    name: Rust 门禁 (cargo check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libayatana-appindicator3-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
