# 百工发布 —— main 分支：稳定分支检查（文档阶段仓库）。
# 三分支分工：develop 门禁 / qa 复跑检查 / main 本文件。
# 正式发布（tag + GitHub Release）随代码落地后启用。

name: 发布流水线 (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docs-gate:
    name: 稳定分支结构检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 结构完整性检查
        run: |
          test -f README.md
          echo "文档阶段仓库：仅确认结构完整，正式发布随代码落地后启用。"
